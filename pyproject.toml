[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwed-legal"
version = "0.4.0"
description = "Deterministic rejection layer for computational legal claims. Verifies dates, amounts, and structured constraints; blocks unproven legal outputs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Rahul Dass", email = "rahul@qwedai.com" }
]
keywords = [
    "legal",
    "ai",
    "verification",
    "contracts",
    "llm",
    "hallucination",
    "law",
    "compliance"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
]
dependencies = [
    "z3-solver>=4.12.0",
    "python-dateutil>=2.8.0",
    "sympy>=1.12",
    "holidays>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Aligned with required-version under [tool.ruff]
    "ruff==0.16.1",
]

[project.urls]
Homepage = "https://github.com/QWED-AI/qwed-legal"
Documentation = "https://docs.qwedai.com/legal"
Repository = "https://github.com/QWED-AI/qwed-legal"
Issues = "https://github.com/QWED-AI/qwed-legal/issues"

[tool.hatch.build.targets.wheel]
packages = ["qwed_legal"]

[tool.ruff]
line-length = 100
target-version = "py310"
required-version = "==0.16.1"

[tool.ruff.lint]
# Pin the lint gate to the stable default ruleset. Ruff's default rule
# selection expanded in newer releases, which silently changed what
# `ruff check .` enforces in CI; an explicit select keeps the gate stable.
select = ["E4", "E7", "E9", "F"]
